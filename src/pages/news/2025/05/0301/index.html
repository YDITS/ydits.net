            </span>

            <p class="article__text main__text">
                　平素はYDITS（以下「当サービス」）をご利用いただき誠にありがとうございます。<br>
                Version 3.18.0 より、当サービスで提供している防災ウェブアプリケーション「YDITS for Web」の緊急地震速報の取得先を「Wolfx 防災API」に変更しました。<br>
                <br>
                これにより、YDITS for Web では以下のような緊急地震速報が受信可能になりました。<br>
                <ul>
                    <li>
                        <p>
                            深発、PLUM法などの緊急地震速報
                        </p>
                    </li>
                    <li>
                        <p>
                            キャンセル報
                        </p>
                    </li>
                </ul>
                <br>
                YDITS は今後も、サービスの向上に取り組んでまいります。
            </p>
